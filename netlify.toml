[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://clothbiz-api-and-frontend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/Shop/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/Shop/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/"
  to = "/Shop/"
  status = 301

[[redirects]]
  from = "/Shop/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
